# ─────────────────────────────────────────────────────────────
# .github/workflows/ci-cd.yml
# CI/CD Pipeline: Test → Build → Push to ECR → Deploy to EC2
# Triggered on push to main branch
# ─────────────────────────────────────────────────────────────

name: CI/CD — Loan Propensity MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       ap-south-1
  ECR_REPOSITORY:   loan-propensity-api
  EC2_HOST:         ${{ secrets.EC2_HOST }}
  IMAGE_TAG:        ${{ github.sha }}

jobs:

  # ── Job 1: Run unit tests ─────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml


  # ── Job 2: Build & push Docker image to ECR ──────────────
  build-and-push:
    name: 🐳 Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                      $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Save image URI for next job
        run: |
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" > image_uri.txt

      - name: Upload image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-uri
          path: image_uri.txt


  # ── Job 3: Deploy to EC2 ──────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download image URI
        uses: actions/download-artifact@v4
        with:
          name: image-uri

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:       ${{ secrets.EC2_HOST }}
          username:   ec2-user
          key:        ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR
            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS \
                --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull latest image
            IMAGE_URI=$(cat image_uri.txt)
            docker pull $IMAGE_URI

            # Stop old container gracefully
            docker stop loan-propensity-api 2>/dev/null || true
            docker rm   loan-propensity-api 2>/dev/null || true

            # Start new container
            docker run -d \
              --name loan-propensity-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /home/ec2-user/artifacts:/app/artifacts \
              -v /home/ec2-user/data:/app/data \
              -v /home/ec2-user/logs:/app/logs \
              $IMAGE_URI

            # Health check
            sleep 15
            curl -f http://localhost:8000/health && echo "✅ Deployment successful"

      - name: Notify deployment success
        run: |
          echo "✅ Deployed ${{ env.IMAGE_TAG }} to EC2 successfully"


  # ── Job 4: Retrain model (manual trigger or schedule) ─────
  retrain:
    name: 🔄 Retrain Model
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS (download data from S3)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download latest data from S3
        run: |
          aws s3 cp s3://loan-propensity-mlops/data/Loan_Data_Clean_cld.xlsx \
                    data/raw/Loan_Data_Clean_cld.xlsx

      - name: Run training pipeline
        run: python pipeline/training_pipeline.py

      - name: Upload new model to S3
        run: |
          aws s3 cp artifacts/models/final_model.pkl \
                    s3://loan-propensity-mlops/models/final_model_$(date +%Y%m%d).pkl
          aws s3 cp artifacts/models/preprocessor.pkl \
                    s3://loan-propensity-mlops/models/preprocessor_$(date +%Y%m%d).pkl
